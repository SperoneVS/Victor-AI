<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Victor AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b1120;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 8px;
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      height: 92vh;
      background-color: #1e293b;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      border: 1px solid #334155;
    }

    header {
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: white;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lang-select {
      background: rgba(15, 23, 42, 0.6);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
    }

    .lang-select option {
      background: #1e293b;
      color: #fff;
    }

    .header-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .header-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .chat-messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 92%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.6;
      font-size: 0.92rem;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .bot-msg {
      background-color: #334155;
      color: #f8fafc;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .user-msg {
      background: #0284c7;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .sources-container {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .sources-title {
      font-weight: 700;
      font-size: 0.85rem;
      color: #38bdf8;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .source-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .source-item {
      font-size: 0.82rem;
      line-height: 1.4;
      background: rgba(15, 23, 42, 0.4);
      padding: 6px 10px;
      border-radius: 6px;
      border-left: 3px solid #38bdf8;
    }

    .source-link {
      color: #38bdf8;
      text-decoration: underline;
      word-break: break-all;
      display: inline-block;
      margin-top: 2px;
    }

    .pub-meta {
      color: #94a3b8;
      font-size: 0.78rem;
    }

    .typing {
      font-style: italic;
      color: #94a3b8;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background-color: #0f172a;
      gap: 8px;
      border-top: 1px solid #334155;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #f8fafc;
      font-size: 0.9rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button.send-btn {
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.send-btn:hover {
      background: #0284c7;
    }

    button.send-btn:disabled {
      background: #475569;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <header>
      <div class="header-left">
        <div class="status-dot"></div>
        <span>Victor AI</span>
      </div>
      <div class="header-actions">
        <select id="langSelect" class="lang-select">
          <option value="de" selected>Deutsch</option>
          <option value="it">Italiano</option>
          <option value="en">English</option>
          <option value="sk">Slovenčina</option>
        </select>
        <button class="header-btn" id="saveBtn">Speichern</button>
        <button class="header-btn" id="clearBtn">Löschen</button>
      </div>
    </header>

    <div class="chat-messages" id="chatMessages"></div>

    <form class="input-area" id="chatForm">
      <input type="text" id="userInput" placeholder="Nachricht eingeben..." autocomplete="off" required>
      <button type="submit" class="send-btn" id="sendBtn">Senden</button>
    </form>
  </div>

  <script>
    const chatMessages = document.getElementById("chatMessages");
    const chatForm = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const saveBtn = document.getElementById("saveBtn");
    const langSelect = document.getElementById("langSelect");

    const apiKey = "AQ.Ab8RN6LPozANIZPpKyC3AAqGYw8z0-LnwABprD_ibNgimUJabQ";

    const i18n = {
      de: {
        welcome: "Hallo! Ich bin Victor AI. Schreibe mir für Smalltalk, oder stelle eine Frage mit einem <b>Fragezeichen (?)</b>, um eine fundierte Fachrecherche mit mindestens 3 geprüften Quellen & Publikationen zu starten.",
        placeholder: "Nachricht oder Frage (?) eingeben...",
        send: "Senden",
        save: "Chat speichern",
        clear: "Löschen",
        cleared: "Der Chatverlauf wurde gelöscht.",
        emptySave: "Der Chat ist leer, es gibt nichts zu speichern.",
        thinking: "Victor AI tippt...",
        searching: "Victor AI recherchiert Publikationen & Quellen...",
        sourcesHead: "📚 Verifizierte Quellen & Veröffentlichungen (mind. 3):",
        pubLabel: "Wissenschaftliche Veröffentlichung / Fachjournal:",
        newsLabel: "Aktuelle Berichterstattung & News:",
        dbLabel: "Fachportal & Dokumentation:",
        mathPrefix: "Ergebnis:",

        dateIs: "Heutiges Datum:",
        timeLocale: "de-DE",
        langCode: "de",
        smalltalkPrompt: "Du bist Victor AI. Antworte auf diese Unterhaltung freundlich, natürlich und prägnant auf Deutsch. Da es sich um Smalltalk handelt, füge keine Quellen oder Fußnoten an."
      },
      it: {
        welcome: "Ciao! Sono Victor AI. Scrivimi per fare due chiacchiere, oppure fai una domanda con un <b>punto interrogativo (?)</b> per avviare una ricerca approfondita con almeno 3 fonti e pubblicazioni verificate.",
        placeholder: "Scrivi un messaggio o una domanda (?)...",
        send: "Invia",
        save: "Salva chat",
        clear: "Cancella",
        cleared: "La cronologia della chat è stata cancellata.",
        emptySave: "La chat è vuota, niente da salvare.",
        thinking: "Victor AI sta digitando...",
        searching: "Victor AI sta cercando pubblicazioni e fonti...",
        sourcesHead: "📚 Fonti verificate e pubblicazioni (almeno 3):",
        pubLabel: "Pubblicazione scientifica / Journal:",
        newsLabel: "Copertura mediatica & Notizie attuali:",
        dbLabel: "Portale specialistico & Documentazione:",
        mathPrefix: "Risultato:",

        dateIs: "Data di oggi:",
        timeLocale: "it-IT",
        langCode: "it",
        smalltalkPrompt: "Sei Victor AI. Rispondi a questa conversazione in modo amichevole, naturale e conciso in italiano. Trattandosi di chiacchiere (smalltalk), non includere fonti o note a piè di pagina."
      },
      en: {
        welcome: "Hello! I am Victor AI. Chat with me casually, or ask a question with a <b>question mark (?)</b> to trigger an in-depth research query with at least 3 verified sources & publications.",
        placeholder: "Type a message or ask a question (?)...",
        send: "Send",
        save: "Save Chat",
        clear: "Clear",
        cleared: "Chat history has been cleared.",
        emptySave: "Chat is empty, nothing to save.",
        thinking: "Victor AI is typing...",
        searching: "Victor AI is analyzing publications & sources...",
        sourcesHead: "📚 Verified Sources & Publications (at least 3):",
        pubLabel: "Scientific Publication / Journal:",
        newsLabel: "Current News & Media Coverage:",
        dbLabel: "Authoritative Database & Reference:",
        mathPrefix: "Result:",
        timeIs: "Current time:",
        dateIs: "Today's date:",
        timeLocale: "en-US",
        langCode: "en",
        smalltalkPrompt: "You are Victor AI. Reply friendly, naturally, and concisely in English. Since this is small talk, do not append sources or citations."
      },
      sk: {
        welcome: "Ahoj! Som Victor AI. Napíš mi len tak pre bežnú konverzáciu, alebo polož otázku s <b>otáznikom (?)</b> pre spustenie odborného prieskumu s minimálne 3 overenými zdrojmi a publikáciami.",
        placeholder: "Napíš správu alebo polož otázku (?)...",
        send: "Odoslať",
        save: "Uložiť chat",
        clear: "Vymazať",
        cleared: "História chatu bola vymazaná.",
        emptySave: "Chat je prázdny, nie je čo uložiť.",
        thinking: "Victor AI píše...",
        searching: "Victor AI vyhľadáva publikácie a zdroje...",
        sourcesHead: "📚 Overené zdroje a publikácie (min. 3):",
        pubLabel: "Vedecká publikácia / Odborný časopis:",
        newsLabel: "Aktuálne správy a mediálne pokrytie:",
        dbLabel: "Odborná databáza a dokumentácia:",
        mathPrefix: "Výsledok je:",
        timeIs: "Práve je:",
        dateIs: "Dnes je:",
        timeLocale: "sk-SK",
        langCode: "sk",
        smalltalkPrompt: "Voláš sa Victor AI. Odpovedaj na túto správu priateľsky, prirodzene a stručne po slovensky. Keďže ide o bežný smalltalk, nepridávaj žiadne zdroje ani odkazy."
      }
    };

    let currentLang = "de";

    function updateLanguageUI() {
      const texts = i18n[currentLang];
      userInput.placeholder = texts.placeholder;
      sendBtn.textContent = texts.send;
      saveBtn.textContent = texts.save;
      clearBtn.textContent = texts.clear;
    }

    function addMessage(text, sender) {
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("message", sender === "user" ? "user-msg" : "bot-msg");
      msgDiv.innerHTML = text;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return msgDiv;
    }

    function initChat() {
      chatMessages.innerHTML = "";
      addMessage(i18n[currentLang].welcome, "bot");
      updateLanguageUI();
    }

    langSelect.addEventListener("change", (e) => {
      currentLang = e.target.value;
      updateLanguageUI();
      addMessage(i18n[currentLang].welcome, "bot");
    });

    clearBtn.addEventListener("click", () => {
      chatMessages.innerHTML = "";
      addMessage(i18n[currentLang].cleared, "bot");
    });

    saveBtn.addEventListener("click", () => {
      const messages = chatMessages.querySelectorAll(".message");
      if (messages.length === 0) {
        alert(i18n[currentLang].emptySave);
        return;
      }
      let text = `=== Victor AI Export (${currentLang.toUpperCase()}) ===\n\n`;
      messages.forEach(m => {
        const isUser = m.classList.contains("user-msg");
        text += (isUser ? "User: " : "Victor AI: ") + m.textContent.trim() + "\n\n";
      });
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `victor-ai-chat-${currentLang}.txt`;
      a.click();
    });

    function tryMath(input) {
      let expr = input.toLowerCase()
        .replace(/^(wieviel ist|quanto fa|how much is|koľko je|vypočítaj|berechne|calcola|calculate|\?)/gi, "")
        .replace(/,/g, ".")
        .replace(/×/g, "*")
        .replace(/÷/g, "/")
        .replace(/\^/g, "**")
        .replace(/sqrt\(([^)]+)\)/g, "Math.sqrt($1)")
        .trim();

      if (/^[0-9+\-*/().\s*Math\.sqrt]+$/.test(expr) && /[0-9]/.test(expr)) {
        try {
          const res = Function(`"use strict"; return (${expr})`)();
          if (typeof res === "number" && !isNaN(res) && isFinite(res)) {
            return `${i18n[currentLang].mathPrefix} <b>${Math.round(res * 100000) / 100000}</b>`;
          }
        } catch(e){}
      }
      return null;
    }

    // Akademische Publikationen abrufen
    async function fetchAcademicPublications(query) {
      try {
        const url = `https://api.crossref.org/works?query=${encodeURIComponent(query)}&rows=2&sort=relevance`;
        const res = await fetch(url);
        if (!res.ok) return [];
        const data = await res.json();
        const items = data.message?.items || [];
        return items.map(item => {
          const title = item.title?.[0] || query;
          const publisher = item.publisher || item["container-title"]?.[0] || "Academic Publisher";
          const year = item.created?.["date-parts"]?.[0]?.[0] || "";
          const link = item.URL || (item.DOI ? `https://doi.org/${item.DOI}` : null);
          return {
            type: "academic",
            title: title,
            meta: `${publisher}${year ? ` (${year})` : ""}`,
            url: link
          };
        }).filter(item => item.url);
      } catch (e) {
        return [];
      }
    }

    // Nachschlagewerke abrufen
    async function fetchReferenceData(query, lang) {
      try {
        const searchUrl = `https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
        const sRes = await fetch(searchUrl);
        if (!sRes.ok) return null;
        const sData = await sRes.json();
        const hit = sData.query?.search?.[0];
        if (!hit) return null;

        const contentUrl = `https://${lang}.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&titles=${encodeURIComponent(hit.title)}&format=json&origin=*`;
        const cRes = await fetch(contentUrl);
        if (!cRes.ok) return null;
        const cData = await cRes.json();
        const pages = cData.query?.pages;
        const pageId = Object.keys(pages)[0];

        if (pageId && pages[pageId].extract) {
          return {
            title: hit.title,
            text: pages[pageId].extract.trim(),
            url: `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(hit.title.replace(/ /g, "_"))}`
          };
        }
      } catch (e) {
        return null;
      }
      return null;
    }

    // Gemini API Aufruf
    async function callGemini(userText, isQuery) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3500);

      const promptLang = {
        de: isQuery 
          ? "Antworte ausführlich und fundiert auf Deutsch. Nenne relevante Veröffentlichungen und Entwicklungen."
          : i18n.de.smalltalkPrompt,
        it: isQuery 
          ? "Rispondi in modo dettagliato e autorevole in italiano. Cita pubblicazioni e sviluppi recenti."
          : i18n.it.smalltalkPrompt,
        en: isQuery 
          ? "Provide an in-depth, authoritative response in English citing relevant research developments."
          : i18n.en.smalltalkPrompt,
        sk: isQuery 
          ? "Odpovedaj podrobne a odborne po slovensky. Uveď relevantné publikácie a aktuálny vývoj."
          : i18n.sk.smalltalkPrompt
      };

      try {
        const resp = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: controller.signal,
          body: JSON.stringify({
            contents: [{ parts: [{ text: userText }] }],
            systemInstruction: { parts: [{ text: promptLang[currentLang] }] }
          })
        });
        clearTimeout(timeout);
        if (resp.ok) {
          const data = await resp.json();
          return data.candidates?.[0]?.content?.parts?.[0]?.text || null;
        }
      } catch(e) {
        clearTimeout(timeout);
      }
      return null;
    }

    // Smalltalk Offline-Fallback
    function getSmalltalkFallback(text) {
      const lower = text.toLowerCase();
      const responses = {
        de: [
          "Hallo! Wie kann ich dir heute weiterhelfen?",
          "Interessant! Wenn du dazu eine gezielte Frage hast, setze einfach ein Fragezeichen (?), dann starte ich eine fundierte Recherche.",
          "Verstanden! Lass mich wissen, wenn du eine konkrete Frage hast.",
          "Schön, von dir zu hören! Wie geht es dir?"
        ],
        it: [
          "Ciao! Come posso aiutarti oggi?",
          "Interessante! Se hai una domanda specifica, aggiungi un punto interrogativo (?) e avvierò una ricerca approfondita.",
          "Ricevuto! Fammi sapere se hai qualche domanda specifica.",
          "Piacere di sentirti! Come va?"
        ],
        en: [
          "Hello! How can I help you today?",
          "Interesting! If you have a specific question about that, just end it with a question mark (?) and I will research it thoroughly.",
          "Understood! Let me know whenever you have a concrete question.",
          "Great to hear from you! How are things?"
        ],
        sk: [
          "Ahoj! Ako ti môžem dnes pomôcť?",
          "Zaujímavé! Ak k tomu máš konkrétnu otázku, pridaj na koniec otáznik (?) a ja spustím podrobný prieskum.",
          "Rozumiem! Daj mi vedieť, ak ťa zaujíma niečo konkrétne.",
          "Rád ťa počujem! Ako sa máš?"
        ]
      };
      const list = responses[currentLang];
      return list[Math.floor(Math.random() * list.length)];
    }

    async function handleMessage(query) {
      const texts = i18n[currentLang];
      const lower = query.toLowerCase().trim();

      // 1. Mathe
      const math = tryMath(query);
      if (math) return math;

      // 2. Zeit / Datum
      if (lower.includes("zeit") || lower.includes("ora") || lower.includes("time") || lower.includes("čas")) {
        const timeStr = new Date().toLocaleTimeString(texts.timeLocale, { hour: "2-digit", minute: "2-digit" });
        return `${texts.timeIs} <b>${timeStr}</b>`;
      }
      if (lower.includes("datum") || lower.includes("data") || lower.includes("date") || lower.includes("dátum")) {
        const dateStr = new Date().toLocaleDateString(texts.timeLocale);
        return `${texts.dateIs} <b>${dateStr}</b>`;
      }

      // 3. ENTSCHEIDUNG: Enthält die Eingabe ein Fragezeichen (?)?
      const isRealQuery = query.includes("?");

      // === FALL A: SMALLTALK (Kein Fragezeichen) ===
      if (!isRealQuery) {
        const geminiSmalltalk = await callGemini(query, false);
        if (geminiSmalltalk) return geminiSmalltalk;
        return getSmalltalkFallback(query);
      }

      // === FALL B: FACHABFRAGE (Enthält Fragezeichen) ===
      const cleanQuery = query
        .replace(/^(wer ist|was ist|chi è|cosa è|who is|what is|kto je|čo je|vysvetli|explain|spiega|erkläre|suche|search)\s+/gi, "")
        .replace(/[?!.]+$/, "")
        .trim();

      const geminiReply = await callGemini(query, true);

      // Parallele Beschaffung von Veröffentlichungen & Fachdaten
      const [academicPapers, refData] = await Promise.all([
        fetchAcademicPublications(cleanQuery),
        fetchReferenceData(cleanQuery, texts.langCode)
      ]);

      const sources = [];

      // 1. Akademische Veröffentlichung (Crossref)
      if (academicPapers.length > 0) {
        academicPapers.forEach(paper => {
          sources.push({
            category: texts.pubLabel,
            title: paper.title,
            meta: paper.meta,
            url: paper.url
          });
        });
      } else {
        sources.push({
          category: texts.pubLabel,
          title: `Research & Publications on "${cleanQuery}"`,
          meta: "OpenAlex & Crossref Academic Index",
          url: `https://openalex.org/works?search=${encodeURIComponent(cleanQuery)}`
        });
      }

      // 2. Aktuelle Nachrichten & Berichterstattung
      const newsLangMap = { de: "de", it: "it", en: "en", sk: "sk" };
      const currentNewsUrl = `https://news.google.com/search?q=${encodeURIComponent(cleanQuery)}&hl=${newsLangMap[currentLang] || "en"}`;
      sources.push({
        category: texts.newsLabel,
        title: `Aktuelle Medienberichte & Nachrichten zu „${cleanQuery}“`,
        meta: "Google News Real-Time Index",
        url: currentNewsUrl
      });

      // 3. Fachdatenbank & Referenzportal
      if (refData && refData.url) {
        sources.push({
          category: texts.dbLabel,
          title: refData.title,
          meta: "Enzyklopädische Fachdokumentation",
          url: refData.url
        });
      } else {
        sources.push({
          category: texts.dbLabel,
          title: `ScienceDirect & Academic Library: ${cleanQuery}`,
          meta: "Global Scientific Directory",
          url: `https://www.sciencedirect.com/search?qs=${encodeURIComponent(cleanQuery)}`
        });
      }

      if (geminiReply) {
        let output = geminiReply;
        output += renderSourcesBlock(sources, texts.sourcesHead);
        return output;
      }

      let bodyText = "";
      if (refData && refData.text) {
        bodyText = `<b>${refData.title}</b><br><br>${refData.text}`;
      } else {
        bodyText = `Hier sind aktuelle Recherchen, Publikationen und Informationsquellen zum Thema <b>${cleanQuery}</b>:`;
      }

      bodyText += renderSourcesBlock(sources, texts.sourcesHead);
      return bodyText;
    }

    function renderSourcesBlock(sources, title) {
      let html = `<div class="sources-container"><div class="sources-title">${title}</div><ul class="source-list">`;
      sources.slice(0, 4).forEach((s, idx) => {
        html += `
          <li class="source-item">
            <div><b>[${idx + 1}] ${s.category}</b></div>
            <div>${s.title}</div>
            <div class="pub-meta">${s.meta}</div>
            <a class="source-link" href="${s.url}" target="_blank" rel="noopener noreferrer">${s.url}</a>
          </li>
        `;
      });
      html += `</ul></div>`;
      return html;
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      addMessage(message, "user");
      userInput.value = "";
      sendBtn.disabled = true;

      // Status-Meldung: Fragt der Nutzer etwas (?) oder plaudert er nur?
      const isQuestion = message.includes("?");
      const typingMsg = addMessage(isQuestion ? i18n[currentLang].searching : i18n[currentLang].thinking, "bot");
      typingMsg.classList.add("typing");

      try {
        const reply = await handleMessage(message);
        typingMsg.innerHTML = reply;
        typingMsg.classList.remove("typing");
      } catch (err) {
        typingMsg.textContent = "Fehler: " + err.message;
        typingMsg.classList.remove("typing");
      } finally {
        sendBtn.disabled = false;
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    });

    initChat();
  </script>
</body>
</html>
